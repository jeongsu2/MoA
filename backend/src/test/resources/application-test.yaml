spring:
  datasource:
    hikari:
      # 동시성 테스트가 20개 요청을 한꺼번에 보낸다. 기본 10이면 풀 대기와 락 대기가 섞여 원인을 가리기 어렵다
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: create-drop

moa:
  scheduler:
    # 자동 실행이 켜져 있으면 고정 시계를 옮기는 순간 테스트 밖에서 만료가 돌아 결과가 섞인다. 테스트가 직접 부른다
    enabled: false
  image:
    # 테스트가 레포 안 uploads 폴더를 건드리지 않게 임시 폴더에 저장
    dir: ${java.io.tmpdir}/moa-test-uploads
