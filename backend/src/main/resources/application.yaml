spring:
  application:
    name: moa
  jpa:
    # 요청이 끝날 때까지 DB 커넥션을 잡지 않도록 끔 (판매 오픈 때 커넥션 풀 고갈 방지)
    open-in-view: false
    hibernate:
      # 지금은 로컬과 테스트뿐이라 ddl-auto로 테이블을 만든다. 운영 배포 전에 Flyway로 바꾼다 (D-36)
      ddl-auto: update
  jackson:
    deserialization:
      # 가격 1.5를 1로 바꿔 받지 않고 400으로 거부한다 (03 문서 AC-6)
      accept-float-as-int: false
  servlet:
    multipart:
      # 파일 1장 상한은 moa.image.max-file-size와 같게. 요청 전체는 multipart 경계 문자열만큼 여유를 둔다
      max-file-size: ${moa.image.max-file-size}
      # max-file-size를 올리면 이 값도 1MB 이상 크게 같이 올린다
      max-request-size: 11MB

server:
  servlet:
    session:
      # 판매를 기다리다 끊기지 않게 7일 (D-34). 쿠키 탈취 시 위험 기간이 긴 대신
      timeout: 7d
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # 쿠키도 7일 유지. 없으면 브라우저를 닫을 때 쿠키가 사라진다
        max-age: 7d

moa:
  scheduler:
    # 5분 만료 스케줄러 자동 실행 (06 문서). 테스트 프로필에서는 끈다
    enabled: true
  image:
    # 로컬 디스크 저장 폴더 (D-17). 서버를 실행한 위치 기준
    dir: ./uploads
    # 1장 10MB, 글당 10장 (03 문서 Q-3)
    max-file-size: 10MB
    max-count-per-post: 10
